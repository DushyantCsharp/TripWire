global:
  scrape_interval: 15s

# Tripwire's metrics arrive by OTLP push from the collector (--web.enable-otlp-receiver).
otlp:
  promote_resource_attributes:
    - deployment.environment.name

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
