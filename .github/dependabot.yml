# Keeps what's pinned by digest current: the workflows' action SHAs and the Dockerfile's base
# images. One grouped pull request a week per ecosystem; CI and the release scan vet them.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    # A release a week old before it's proposed: time for a compromised one to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A release a week old before it's proposed: time for a compromised one to be caught.
    cooldown:
      default-days: 7
    # The build stage's Node must stay on the runtime's major (distroless nodejs22, .nvmrc): a
    # newer major would install dependencies for a Node the images don't run.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']
