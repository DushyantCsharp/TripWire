# A version tag (git tag v1.2.3 && git push origin v1.2.3) releases the api, worker and console
# images from the root Dockerfile, for linux/amd64 and linux/arm64: scanned before anything is
# pushed (a critical vulnerability with a fix stops the release), then pushed to GHCR with an SBOM,
# a provenance attestation, and a Sigstore-signed one (OIDC, keyless) that
# `gh attestation verify oci://ghcr.io/<owner>/tripwire-api:1.2.3 --owner <owner>` checks.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A release runs to the end.
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.app }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, console]
    permissions:
      contents: read
      # Push to GHCR with the job's own short-lived token.
      packages: write
      # OIDC: Sigstore signs the provenance attestation without a stored key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        # Registries want lower case; the same name goes to the tags, the scan and the attestation.
        run: echo "image=ghcr.io/${OWNER,,}/tripwire-$APP" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # 1.2.3, 1.2, 1 (not for 0.x, where a minor can break), and sha-<short>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=tripwire-${{ matrix.app }}
            org.opencontainers.image.description=Tripwire incident triage: ${{ matrix.app }}

      - name: Build for the scan (amd64, kept local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Scan, failing on a critical vulnerability that has a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      # A separate pass for the full report: as SARIF, the first would drop its severity filter.
      - name: Scan report, every severity
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:scan
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          exit-code: '0'
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: trivy-${{ matrix.app }}
          path: trivy-${{ matrix.app }}.sarif
          if-no-files-found: ignore
          retention-days: 90

      - name: Build and push (amd64 and arm64, with SBOM and provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Attest the build (Sigstore, keyless through OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
